buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.4.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20")
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 34)
    
    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 34)
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    namespace 'com.moniepointpossdk'
}

repositories {
    google()
    mavenCentral()
    
    // Moniepoint Maven Repository
    // Users will configure credentials in their gradle.properties
    maven {
        url = uri(findProperty('moniepointRepoUrl') ?: 'https://open-repository.moniepoint.com/repository/public')
        credentials {
            username = findProperty('moniepointUsername') ?: ''
            password = findProperty('moniepointPassword') ?: ''
        }
    }
}

dependencies {
    implementation "com.facebook.react:react-native:+"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"
    
    // Moniepoint SDK - version can be configured by user
    def moniepointVersion = findProperty('moniepointSdkVersion') ?: '1.0.10'
    implementation "com.moniepoint:paap.sdk:$moniepointVersion"
    implementation 'com.google.code.gson:gson:2.11.0'
}

